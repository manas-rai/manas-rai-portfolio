# Answers shown by the ⌘K console's /interview command.
#
# Every fact here comes from the linked case study. The phrasing is kept plain
# and matter-of-fact on purpose — a stylish line reads as written, and these
# should read as spoken. If a sentence isn't one you'd say in a room, change it.
# `answer` accepts several paragraphs (blank-line separated).

- question: How do you keep a multi-agent system from compounding its own errors?
  answer: |
    You test it like a system, not like a chatbot.

    In RegLens every stage — ingestion, retrieval, gap analysis, risk scoring,
    routing — has component evals against a labelled golden dataset. On top of
    those are behavioural tests that check properties rather than exact outputs:
    monotonicity, so a more severe input never scores lower risk; invariance, so
    irrelevant rewording doesn't change the verdict; and counterfactuals.

    A single accuracy number hides silent regressions. Property tests don't.
  link: reglens
  link_label: RegLens — the evals harness

- question: One model, or several?
  answer: |
    Several, when the sub-tasks genuinely differ. RegLens uses Gemini and Claude
    on purpose — Gemini's multimodal reading handles messy regulatory PDFs, and
    Claude's structured output is more reliable for the gap-analysis reasoning
    that has to come back as clean, typed data.

    The other half of that is keeping the model layer swappable. DevFlow Kit
    runs provider-agnostic across Anthropic, OpenAI, and Google, so it isn't
    tied to one vendor's API or pricing.
  link: reglens
  link_label: RegLens — why multiple models

- question: When do you reach for ML, and when are rules enough?
  answer: |
    Rules first. I reach for ML when the boundary isn't a threshold.

    In Cloud Waste Hunter, idle EC2 detection uses an Isolation Forest, because
    "idle" isn't one clean cutoff — utilisation patterns vary between workloads,
    so outlier detection works better than a fixed number. Unattached EBS
    volumes over 30 days and snapshots over 90 days with no associated AMI are
    plain rules, because those genuinely are thresholds.

    Using ML there would add a model to maintain and explain, and buy nothing.
  link: cloud-waste-hunter
  link_label: Cloud Waste Hunter — detection

- question: What makes a long-running agent safe to actually operate?
  answer: |
    You need to be able to stop it, watch it, and overrule it.

    RegLens checkpoints its supervisor in Postgres, so a run is durable and
    resumable instead of restarting from zero. It interrupts at the report stage
    on purpose: the reviewer sees the draft and can approve it, override
    individual gap verdicts inline, or reject the run. Progress streams over SSE
    throughout, so a long run is observable rather than a black box.

    Run state, checkpoints, policy embeddings, and the audit log all live in one
    Postgres instance.
  link: reglens
  link_label: RegLens — durable and human-gated

- question: What did you deliberately choose not to build?
  answer: |
    Infrastructure, mostly.

    The requirement I cared about most in DevFlow Kit was that there'd be
    nothing new to run — no server, no queue, no hosted service to pay for and
    secure. The pipeline executes on GitHub Actions you already have.

    Same in CostTracker. Production targets ClickHouse because per-request
    analytics is a columnar workload, but requiring ClickHouse just to try the
    tool would put people off, so the same schema runs on PostgreSQL locally.
    And instead of hand-maintaining LLM prices it syncs from LiteLLM's public
    pricing data — 1,800+ models, no price file for anyone to forget.
  link: devflow-kit
  link_label: DevFlow Kit — zero added infrastructure
